<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Hub — History</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Weather Hub</h1>
      <p class="station-name" id="station-name"></p>
      <nav class="site-nav">
        <a href="/">Current</a>
        <a href="/history.html" class="active">History</a>
      </nav>
    </header>

    <section class="current-card">
      <div class="range-selector" role="group" aria-label="Time range">
        <button type="button" data-range="day" class="active">Day</button>
        <button type="button" data-range="week">Week</button>
        <button type="button" data-range="month">Month</button>
        <button type="button" data-range="year">Year</button>
      </div>

      <div class="custom-range">
        <label>From <input type="date" id="range-start" /></label>
        <label>To <input type="date" id="range-end" /></label>
        <button type="button" id="apply-custom-range">Apply</button>
      </div>

      <div class="stat-grid" id="summary-stats">
        <div class="stat-tile">
          <span class="stat-label">Low</span>
          <span class="stat-value" id="stat-low">&mdash;</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">Average</span>
          <span class="stat-value" id="stat-avg">&mdash;</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">High</span>
          <span class="stat-value" id="stat-high">&mdash;</span>
        </div>
      </div>

      <p class="last-updated" id="history-status"></p>
    </section>

    <div id="chart-grid"></div>
  </main>

  <script src="/js/vendor/chart.umd.min.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
